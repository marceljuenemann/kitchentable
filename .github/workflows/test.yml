name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies (Supabase CLI, Playwright)
        run: npm ci

      - name: Install web app dependencies
        run: npm ci --prefix web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Supabase (runs migrations + seed.sql)
        run: npx supabase start

      - name: Reset database for a clean, deterministic seeded state
        run: npx supabase db reset

      - name: Run pgTAP tests
        run: npx supabase test db --local supabase/tests/database

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
