name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded PR runs are cancelled. Every other run gets a group of its own: cancelling a run
# on main could kill a deploy halfway through a migration, and a run waiting for production
# approval would hold up every later push. The deploy jobs queue up in their own groups instead.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fast checks, no Docker: fails within a couple of minutes on formatting, lint, type errors
  # or a broken production build, while the slower e2e job below is still running.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web app dependencies
        run: npm ci --prefix web

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Lint (angular-eslint)
        run: npm run lint

      - name: Type-check e2e specs
        run: npm run typecheck:e2e

      - name: Production build (strict TypeScript + templates)
        run: npm run build --prefix web

      - name: Unit tests (Karma)
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies (Supabase CLI, Playwright)
        run: npm ci

      - name: Install web app dependencies
        run: npm ci --prefix web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start Supabase (runs migrations)
        run: npx supabase start

      - name: Reset database for a clean, deterministic state
        run: npx supabase db reset

      # Restricted to our own schema: the default also lints pgTAP's `extensions` schema,
      # whose internals produce "errors" that aren't ours.
      - name: Lint database functions
        run: npx supabase db lint --local --schema public --fail-on error

      - name: Run pgTAP tests
        run: npx supabase test db --local supabase/tests/database

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploys main to staging once both jobs above pass (see deploy.yml for the steps).
  # The deploy jobs read their secrets from the GitHub environment named in `environment`.
  deploy-staging:
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: staging
      url: https://staging.kitchentable.dating
      project-ref: ceqkaciklgqzfwycrrfx
      build-configuration: staging
      pages-project: kitchentable-staging
      noindex: true

  # Then waits for approval in the `production` environment (required reviewers) and deploys
  # the same commit to production. Only the latest commit on main can be deployed.
  deploy-production:
    needs: [deploy-staging]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
    with:
      environment: production
      url: https://kitchentable.dating
      project-ref: fdojaontbugknmrjjxjo
      build-configuration: production
      pages-project: kitchentable-production
      latest-only: true
