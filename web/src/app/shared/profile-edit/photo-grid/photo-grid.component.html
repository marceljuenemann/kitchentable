@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

<input
  #picker
  class="picker"
  type="file"
  accept="image/*"
  multiple
  aria-label="Choose photos"
  (change)="onFilesChosen($event)"
/>

<div class="grid" cdkDropList cdkDropListOrientation="mixed" (cdkDropListDropped)="reorder($event)">
  @for (photo of slots(); track photo ? photo.id : 'empty-' + $index) {
    @if (photo) {
      <div
        class="tile filled"
        cdkDrag
        [cdkDragStartDelay]="{ touch: 200, mouse: 0 }"
        [style.view-transition-name]="$index === 0 ? mainTransitionName() : null"
      >
        @if (photo.url) {
          <img [src]="photo.url" [alt]="'Photo ' + ($index + 1)" />
        } @else {
          <mat-spinner class="loading" diameter="24" />
        }
        <span class="badge">Main</span>
        @if (canRemove()) {
          <button
            class="remove"
            type="button"
            [attr.aria-label]="'Remove photo ' + ($index + 1)"
            (click)="onRemove(photo.id)"
          >
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>
    } @else {
      <button class="tile empty" type="button" [disabled]="busy()" (click)="picker.click()">
        <mat-icon>add</mat-icon>
        <span>{{ $index === 0 ? 'Main photo' : 'Add photo' }}</span>
      </button>
    }
  }
</div>
