<button type="button" aria-label="Hug the panda" [class.hugging]="hugging()" (click)="hug()">
  <svg class="drawing" viewBox="0 0 200 200" aria-hidden="true">
    <g class="panda">
      <ellipse class="ink-fill" cx="74" cy="184" rx="17" ry="11" />
      <ellipse class="ink-fill" cx="126" cy="184" rx="17" ry="11" />
      <ellipse class="outline" cx="100" cy="152" rx="48" ry="38" />

      <circle class="ink-fill" cx="60" cy="48" r="19" />
      <circle class="ink-fill" cx="140" cy="48" r="19" />
      <ellipse class="outline" cx="100" cy="84" rx="58" ry="48" />

      <ellipse class="blush" cx="62" cy="108" rx="9" ry="5" />
      <ellipse class="blush" cx="138" cy="108" rx="9" ry="5" />

      <ellipse class="ink-fill" cx="76" cy="86" rx="13" ry="17" transform="rotate(30 76 86)" />
      <ellipse class="ink-fill" cx="124" cy="86" rx="13" ry="17" transform="rotate(-30 124 86)" />
      <g class="eyes-open">
        <circle cx="79" cy="84" r="5" />
        <circle cx="121" cy="84" r="5" />
        <circle class="pupil" cx="80" cy="84.5" r="2.6" />
        <circle class="pupil" cx="120" cy="84.5" r="2.6" />
      </g>
      <path class="eyes-happy" d="M72 88q7-9 14 0M114 88q7-9 14 0" />

      <path class="ink-fill" d="M94 99q6-3 12 0q-3 7-6 7t-6-7z" />
      <path class="line" d="M100 106v3M92 109q4 5 8 0q4 5 8 0" />

      <!-- The logo's heart. -->
      <g class="heart">
        <path
          transform="translate(100 154) scale(.42)"
          d="M0 26C-22 8-38-4-38-20c0-13 10-22 21-22 8 0 14 5 17 11 3-6 9-11 17-11 11 0 21 9 21 22C38-4 22 8 0 26Z"
        />
      </g>
      <!-- Short, chubby arms from the shoulders, their paws on the heart's sides. -->
      <g class="arm left">
        <ellipse cx="76" cy="147" rx="11.5" ry="16" transform="rotate(-40 76 147)" />
      </g>
      <g class="arm right">
        <ellipse cx="124" cy="147" rx="11.5" ry="16" transform="rotate(40 124 147)" />
      </g>
    </g>
  </svg>

  @for (heart of hearts(); track heart.id) {
    <svg
      class="floating-heart"
      viewBox="-40 -44 80 72"
      aria-hidden="true"
      [class]="'colour-' + heart.colour"
      [style.--dx]="heart.dx + 'px'"
      [style.--rotate]="heart.rotate + 'deg'"
      [style.animation-delay.s]="heart.delay"
      (animationend)="remove(heart.id)"
    >
      <path
        d="M0 26C-22 8-38-4-38-20c0-13 10-22 21-22 8 0 14 5 17 11 3-6 9-11 17-11 11 0 21 9 21 22C38-4 22 8 0 26Z"
      />
    </svg>
  }
</button>

<!-- The button's label says it already. -->
<div class="hint" aria-hidden="true" [class.gone]="hugged()">
  <span>Tap me!</span>
  <svg viewBox="0 0 40 30">
    <path d="M34 4Q30 22 8 24M14 18l-6 6 8 3" />
  </svg>
</div>
