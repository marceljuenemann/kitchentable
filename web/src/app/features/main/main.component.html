<router-outlet />

<nav aria-label="Main" [class.animated]="animated()">
  <!-- The active tab's pill, one for all tabs, so it can slide from one to the next. -->
  <span class="indicator" aria-hidden="true"><span></span></span>
  @for (tab of tabs; track tab.path) {
    <a
      [routerLink]="tab.path"
      [class.active]="tab === currentTab()"
      [attr.aria-current]="tab === currentTab() ? 'page' : null"
      [attr.aria-label]="tab.label"
    >
      <span class="pill">
        @if (tab.icon) {
          <svg
            class="icon"
            viewBox="0 0 24 24"
            width="26"
            height="26"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path [attr.d]="tab.icon" />
          </svg>
        } @else {
          <!-- The logo (public/logo.svg) in one colour, so it follows the tab's. -->
          <svg
            class="logo"
            viewBox="0 0 360 360"
            width="32"
            height="32"
            fill="none"
            stroke="currentColor"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <g transform="translate(180 180)">
              <circle r="70" />
              <path d="M-111.51 -23.7A114 114 0 0 1 -23.7 -111.51" />
              <path d="M23.7 -111.51A114 114 0 0 1 111.51 -23.7" />
              <path d="M111.51 23.7A114 114 0 0 1 23.7 111.51" />
              <path d="M-23.7 111.51A114 114 0 0 1 -111.51 23.7" />
            </g>
            <path
              transform="translate(180 180) scale(.9) translate(0 8)"
              fill="currentColor"
              stroke="none"
              d="M0 26C-22 8-38-4-38-20c0-13 10-22 21-22 8 0 14 5 17 11 3-6 9-11 17-11 11 0 21 9 21 22C38-4 22 8 0 26Z"
            />
          </svg>
        }
      </span>
    </a>
  }
</nav>
