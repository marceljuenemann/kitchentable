@if (member(); as member) {
  <app-profile-view [profile]="member" [photoUrls]="photoUrls()" backLabel="Back to search">
    <!-- Holds the bar's room at the end of the page; the bar itself stays at the bottom. -->
    <div class="kt-profile-actions">
      <div class="kt-profile-bar">
        <!-- Also the accessible alternative to swiping a tile away. -->
        <button class="hide" mat-stroked-button type="button" (click)="hide(member)">
          <span class="label">
            <app-hide-icon />
            Hide profile
          </span>
        </button>
        <button
          class="reach-out"
          mat-flat-button
          type="button"
          [disabled]="introsRemaining() === 0"
          (click)="reachOut(member)"
        >
          <span class="label">
            <app-heart />
            Reach out
          </span>
        </button>
        @if (introsRemaining() === 0) {
          <p class="no-intros">No introductions left for today</p>
        }
      </div>
    </div>
  </app-profile-view>
} @else if (member() === null) {
  <div class="gone">
    <p>This profile isn't available.</p>
    <a mat-flat-button routerLink="/app">Back to search</a>
  </div>
}
