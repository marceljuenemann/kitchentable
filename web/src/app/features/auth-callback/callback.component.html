<div class="callback-page">
  @if (!timedOut()) {
    <!-- The same as the loading pages after it, so signing in looks like one wait. -->
    <div class="kt-page-loading" role="status">
      <span class="kt-visually-hidden">Signing you in…</span>
    </div>
  } @else {
    <p>This sign-in link may have expired or already been used. Please request a new one.</p>
    <a mat-flat-button color="primary" routerLink="/">Back to start</a>
  }
</div>
