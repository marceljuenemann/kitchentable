<p class="eyebrow">Step 3 of {{ totalSteps }}</p>
<h1>Add photos</h1>
<p class="subtitle">Select up to six photos.</p>

@if (error()) {
  <p class="error" role="alert">{{ error() }}</p>
}

<input
  #picker
  class="picker"
  type="file"
  accept="image/*"
  multiple
  aria-label="Choose photos"
  (change)="onFilesChosen($event)"
/>

<div class="grid">
  @for (photo of slots(); track $index) {
    @if (photo) {
      <div class="tile filled">
        <img [src]="photo.thumbUrl" [alt]="'Photo ' + ($index + 1)" />
        @if ($index === 0) {
          <span class="badge">Main</span>
        }
        <button
          class="remove"
          type="button"
          [attr.aria-label]="'Remove photo ' + ($index + 1)"
          (click)="remove(photo.id)"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
    } @else {
      <button class="tile empty" type="button" [disabled]="busy()" (click)="picker.click()">
        <mat-icon>add</mat-icon>
        <span>{{ $index === 0 ? 'Main photo' : 'Add photo' }}</span>
      </button>
    }
  }
</div>

@if (photos().length === 0) {
  <p class="empty-hint">Add at least one photo to continue.</p>
}

<button mat-flat-button class="continue" type="button" [disabled]="!canContinue()" (click)="next()">
  Continue
</button>
