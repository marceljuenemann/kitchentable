<p class="kt-step-eyebrow">Step 3 of {{ totalSteps }}</p>
<h1 class="kt-step-title">Add photos</h1>
<p class="kt-step-subtitle">Select up to six photos. Drag and drop to reorder.</p>

<app-photo-grid
  [photos]="photoIds()"
  [remove]="remove"
  (added)="store.addPhoto($event)"
  (reordered)="store.update({ photos: $event })"
  (missing)="store.removePhoto($event)"
/>

<button mat-flat-button class="continue" type="button" [disabled]="!canContinue()" (click)="next()">
  Continue
</button>
