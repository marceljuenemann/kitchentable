<p class="kt-step-eyebrow">Step 3 of {{ totalSteps }}</p>
<h1 class="kt-step-title">Upload photos</h1>
<p class="kt-step-subtitle">Select up to six photos. Drag and drop to reorder.</p>

<app-photo-grid
  [photos]="photoIds()"
  [remove]="remove"
  (added)="store.addPhoto($event)"
  (reordered)="store.update({ photos: $event })"
  (missing)="store.removePhoto($event)"
/>

@if (failed()) {
  <p class="error" role="alert">
    We couldn't create your profile. Check your connection and try again.
  </p>
}

<button
  mat-flat-button
  class="continue"
  type="button"
  [disabled]="!canSubmit()"
  [attr.aria-describedby]="photoIds().length === 0 ? 'create-hint' : null"
  (click)="submit()"
>
  {{ submitting() ? 'Creating profile…' : 'Create profile' }}
</button>
@if (photoIds().length === 0) {
  <p id="create-hint" class="kt-fine-print kt-missing-hint">
    Add at least one photo to create your profile.
  </p>
}
