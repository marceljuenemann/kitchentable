<p class="kt-step-eyebrow">Step 3 of {{ totalSteps }}</p>
<h1 class="kt-step-title">Add photos</h1>
<p class="kt-step-subtitle">Select up to six photos. Drag and drop to reorder.</p>

<app-photo-grid
  [photos]="photoIds()"
  [remove]="remove"
  (added)="store.addPhoto($event)"
  (reordered)="store.update({ photos: $event })"
  (missing)="store.removePhoto($event)"
/>

@if (failed()) {
  <p class="error" role="alert">
    We couldn't submit your application. Check your connection and try again.
  </p>
}

<button mat-flat-button class="continue" type="button" [disabled]="!canSubmit()" (click)="submit()">
  {{ submitting() ? 'Submitting…' : 'Submit application' }}
</button>
