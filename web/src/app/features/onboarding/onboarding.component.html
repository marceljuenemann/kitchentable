<app-header />

<app-onboarding-progress [step]="step()" [canGoBack]="step() > 1" (back)="back()" />

<main>
  @switch (draft().step) {
    @case (1) {
      <app-create-profile-step />
    }
    @case (2) {
      <app-about-you-step />
    }
    @case (3) {
      <app-photos-step />
    }
  }
</main>

<app-footer />
