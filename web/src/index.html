         previews show the production image too. Never edit the image in place: apps cache previews
         by URL, so add og-image-v2.png instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kitchen Table" />
    <meta property="og:title" content="Kitchen Table" />
    <meta
      property="og:description"
      content="A non-profit dating community for ENM folks in London."
    />
    <meta property="og:image" content="https://kitchentable.dating/og-image-v1.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kitchen Table logo: ENM dating, reimagined." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
